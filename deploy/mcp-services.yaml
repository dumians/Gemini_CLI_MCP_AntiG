apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: retail-spanner-mcp
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/ingress: internal-and-cloud-load-balancing
        run.googleapis.com/timeout: "3600"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      containers:
      - image: europe-west3-docker.pkg.dev/PROJECT_ID/mesh-repo/spanner-mcp:latest
        env:
        - name: MCP_SERVICE
          value: "spanner-mcp"
        - name: GCP_PROJECT_ID
          value: "PROJECT_ID"
        - name: SPANNER_INSTANCE_ID
          value: "global-retail-instance"
        - name: SPANNER_DATABASE_ID
          value: "global-retail-db"
---
