apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: crm-alloydb-mcp
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/ingress: internal-and-cloud-load-balancing
        run.googleapis.com/timeout: "3600"
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
    spec:
      containers:
      - image: europe-west3-docker.pkg.dev/PROJECT_ID/mesh-repo/alloydb-mcp:latest
        env:
        - name: MCP_SERVICE
          value: "alloydb-mcp"
        - name: GCP_PROJECT_ID
          value: "PROJECT_ID"
        - name: ALLOYDB_REGION
          value: "europe-west1"
        - name: ALLOYDB_CLUSTER
          value: "crm-cluster"
        - name: ALLOYDB_INSTANCE
          value: "crm-instance-1"
        - name: ALLOYDB_USER
          value: "postgres"
        - name: ALLOYDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ALLOYDB_PASSWORD
              key: latest
        - name: ALLOYDB_DB
          value: "postgres"
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hr-oracle-mcp
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/ingress: internal-and-cloud-load-balancing
        run.googleapis.com/timeout: "3600"
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
    spec:
      containers:
      - image: europe-west3-docker.pkg.dev/PROJECT_ID/mesh-repo/oracle-mcp:latest
        env:
        - name: MCP_SERVICE
          value: "oracle-mcp"
        - name: GCP_PROJECT_ID
          value: "PROJECT_ID"
        - name: ORACLE_USER
          value: "ERP_READER"
        - name: ORACLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ORACLE_PASSWORD
              key: latest
        - name: ORACLE_CONNECT_STRING
          value: "your-oracle-host:1521/xe"
---
