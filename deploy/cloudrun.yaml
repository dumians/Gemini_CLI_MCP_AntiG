apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mesh-orchestrator
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/timeout: "3600"
    spec:
      containers:
      - image: europe-west3-docker.pkg.dev/PROJECT_ID/mesh-repo/mesh-orchestrator:latest
        ports:
        - containerPort: 8080
        env:
        - name: GCP_PROJECT_ID
          value: "PROJECT_ID"
        - name: NODE_ENV
          value: "production"
        - name: USE_REAL_CONNECTIONS
          value: "true"
        - name: GCP_ONE_MCP_ENABLED
          value: "true"
        - name: ONE_MCP_MODE
          value: "microservices"
        - name: JWT_SECRET
          value: "strategic-mesh-secret-key-2026"
        - name: ADMIN_USERNAME
          value: "admin"
        - name: ADMIN_PASSWORD
          value: "mesh_command_2026"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: GEMINI_API_KEY
              key: latest
        - name: SPANNER_MCP_URL
          value: "https://retail-spanner-mcp-XYZ-ew.a.run.app"
        - name: BIGQUERY_MCP_URL
          value: "https://analytics-bigquery-mcp-XYZ-ew.a.run.app"
        - name: ALLOYDB_MCP_URL
          value: "https://crm-alloydb-mcp-XYZ-ew.a.run.app"
        - name: ORACLE_MCP_URL
          value: "https://hr-oracle-mcp-XYZ-ew.a.run.app"
        - name: HR_MCP_URL
          value: "https://hr-oracle-mcp-XYZ-ew.a.run.app"
        - name: WAREHOUSE_MCP_URL
          value: "https://hr-oracle-mcp-XYZ-ew.a.run.app"
        - name: ONE_MCP_URL
          value: "https://gcp-one-mcp-XYZ-ew.a.run.app"
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mesh-webapp
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/timeout: "3600"
    spec:
      containers:
      - image: europe-west3-docker.pkg.dev/PROJECT_ID/mesh-repo/mesh-webapp:latest
        ports:
        - containerPort: 8080
        env:
        - name: VITE_API_BASE_URL
          value: "https://mesh-orchestrator-XYZ-ew.a.run.app"
